[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repodoctor"
version = "0.1.0"
description = "A CLI tool for analyzing repository health"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Saad"}
]

dependencies = []

[project.scripts]
repodoctor = "repodoctor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["repodoctor*"]

[tool.repodoctor]
complexity_threshold = 10
large_file_threshold = 500
large_function_threshold = 50
nesting_threshold = 4
argument_threshold = 6
exclude = [
    "tests",
    "demo-project",
]
